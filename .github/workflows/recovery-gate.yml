name: recovery-gate

# Runs the engine tests + the recovery-soundness gate on every push/PR. The gate fails the build if
# a catastrophic misclassification appears, IRREVERSIBLE recall drops below the floor, or the executor
# stops restoring the recoverable subset — i.e. it treats recovery soundness as a release blocker.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The .npmrc release-age cooldown guards FRESH installs (a dev `npm install` pulling a brand-new,
# possibly-compromised version). CI runs a REPRODUCIBLE `npm ci` of the already-committed, vetted
# lockfile, where the cooldown adds no security and would only flake the build for ~a week after a
# dependency bump — so it is disabled for CI here.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: "0"

jobs:
  # Full gate on every Node line the engines field claims to support (>=22): the suite,
  # the eval, and the Lean-backed soundness gate all run per Node version on ubuntu.
  gate:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Pin a recent npm so the engines constraint is enforced at install time (engines alone only warns).
      - run: npm i -g npm@latest
      # Reproducible, no lifecycle scripts from dependencies (supply-chain blast-radius control).
      - run: npm ci --ignore-scripts
      # Compile + lint gates: green CI must prove the code typechecks and lints, not just that tests pass.
      - run: npm run typecheck
      - run: npm run lint
      # The suite runs under coverage; the floors live in vitest.config.ts and fail the
      # build when the measured baseline regresses.
      - run: npm run test:coverage
      - name: coverage in job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              console.log('### Coverage (node ${{ matrix.node-version }})');
              console.log('| metric | covered |');
              console.log('|---|---|');
              for (const k of ['statements', 'branches', 'functions', 'lines'])
                console.log('| ' + k + ' | ' + t[k].pct + '% (' + t[k].covered + '/' + t[k].total + ') |');
            " >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run eval
      # Install elan + Lean so the proof-gate's `lake build` / `lake exe export_table` resolve.
      # `--default-toolchain stable` bootstraps elan; the first `lake build` fetches the toolchain
      # pinned by formal/lean-toolchain. The bin dir is added to PATH for the gate step.
      - name: install elan + Lean
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: recovery-soundness gate
        run: npm run gate

  # The installable artifact, smoke-tested exactly as a stranger would get it: build the bin,
  # `npm pack` the tarball, install it into a clean project, run the binary. NOTE on "private":
  # package.json keeps "private": true until a release is deliberately cut — that flag blocks
  # `npm publish` ONLY; `npm pack` and installing the tarball work as-is (verified), so this job
  # needs no package.json manipulation and proves the future publish artifact on every push.
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm i -g npm@latest
      - run: npm ci --ignore-scripts
      # Build explicitly, then pack with scripts off — the tarball content is exactly what a
      # `npm publish` from this commit would ship (prepack would run the same build).
      - run: npm run build
      - name: pack the tarball
        run: |
          TARBALL="$(npm pack --ignore-scripts | tail -1)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          tar -tzf "$TARBALL" | sort | sed -n '1,50p'
      - name: install the tarball into a clean project and run the bin
        run: |
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$TARBALL"
          # --help / --version: the bin resolves and parses args
          npx --no-install toffoli --help
          npx --no-install toffoli --version
          # demo + recover: the engine runs from the installed layout
          npx --no-install toffoli demo | grep -F "RESTITUTION RECEIPT"
          npx --no-install toffoli recover | grep -F "END-TO-END RECOVERY"
          # eval: the packaged dataset resolves from the installed package root
          npx --no-install toffoli eval | grep -F "HEADLINE"
          # classify: stdin → JSON verdicts, deterministic-only (no API key anywhere in this job)
          echo '{"id":"a1","tool":"email.send","op":"send","target":{"kind":"email","externalized":true}}' \
            | npx --no-install toffoli classify - --deterministic-only --compact | grep -F '"IRREVERSIBLE"'

  # Cross-OS smoke: typecheck + the full engine suite on macOS, one cell (node 24).
  # Enough to catch path/fs/subprocess portability regressions. The Lean proof steps are
  # OS-independent and already run per-Node in the ubuntu gate matrix, so this job
  # deliberately stops before `npm run gate` — no elan install on macOS.
  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm i -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm i -g npm@latest
      - run: npm ci --ignore-scripts
      # Fail the build on a high-severity advisory in the dependency tree.
      - name: audit (high+)
        run: npm audit --audit-level=high
      # Verify registry signatures for installed packages (provenance is not enforced at install time;
      # this checks the npm registry signature, the available integrity guarantee in 2026).
      - name: audit signatures
        run: npm audit signatures
