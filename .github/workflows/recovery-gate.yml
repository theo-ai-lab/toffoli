name: recovery-gate

# Runs the engine tests + the recovery-soundness gate on every push/PR. The gate fails the build if
# a catastrophic misclassification appears, IRREVERSIBLE recall drops below the floor, or the executor
# stops restoring the recoverable subset — i.e. it treats recovery soundness as a release blocker.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The .npmrc release-age cooldown guards FRESH installs (a dev `npm install` pulling a brand-new,
# possibly-compromised version). CI runs a REPRODUCIBLE `npm ci` of the already-committed, vetted
# lockfile, where the cooldown adds no security and would only flake the build for ~a week after a
# dependency bump — so it is disabled for CI here.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: "0"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      # Pin a recent npm so the engines constraint is enforced at install time (engines alone only warns).
      - run: npm i -g npm@latest
      # Reproducible, no lifecycle scripts from dependencies (supply-chain blast-radius control).
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run eval
      # Install elan + Lean so the proof-gate's `lake build` / `lake exe export_table` resolve.
      # `--default-toolchain stable` bootstraps elan; the first `lake build` fetches the toolchain
      # pinned by formal/lean-toolchain. The bin dir is added to PATH for the gate step.
      - name: install elan + Lean
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: recovery-soundness gate
        run: npm run gate

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm i -g npm@latest
      - run: npm ci --ignore-scripts
      # Fail the build on a high-severity advisory in the dependency tree.
      - name: audit (high+)
        run: npm audit --audit-level=high
      # Verify registry signatures for installed packages (provenance is not enforced at install time;
      # this checks the npm registry signature, the available integrity guarantee in 2026).
      - name: audit signatures
        run: npm audit signatures
